<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="שילת ורועי מתחתנים! 23 ביוני 2026 — קיסר ים, קיסריה" />
    <title>שילת ורועי | יום החתונה</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>💍</text></svg>" />

    <!-- Social sharing -->
    <meta property="og:title" content="שילת ורועי מתחתנים! 💍" />
    <meta property="og:description" content="23 ביוני 2026 — קיסר ים, קיסריה" />
    <meta property="og:image" content="https://tomershay100.github.io/shilat-roei-wedding/header.png" />
    <meta property="og:url" content="https://tomershay100.github.io/shilat-roei-wedding/wedding-day.html" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preload background images -->
    <link rel="preload" as="image" href="background-image-1.jpeg" />
    <link rel="preload" as="image" href="background-image-2.jpeg" />
    <link rel="preload" as="image" href="background-image-3.jpeg" />
    <link rel="preload" as="image" href="background-image-4.jpeg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=David+Libre:wght@400;500&family=Miriam+Libre&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="wedding-day.css" />
</head>

<body>

    <div class="bg-gradient" id="bg-a"></div>
    <div class="bg-gradient" id="bg-b"></div>
    <div class="landing-overlay"></div>
    <div class="grain"></div>

    <div class="day-content">

        <!-- Header image -->
        <img src="header.png" alt="שילת ורועי" class="day-header-img" />

        <!-- Thank you -->
        <p class="thankyou-text">תודה שבאתם לשמוח איתנו 🕺</p>

        <div class="divider-line"></div>

        <!-- Gifts -->
        <div class="day-gift-section">
            <span class="gift-label">מתנות ואיחולים</span>
            <div class="day-gift-buttons">
                <button class="day-gift-btn" onclick="openBit()" aria-label="Bit payment">
                    <img src="bit-icon.png" alt="Bit" class="day-gift-btn-icon" />
                </button>
                <button class="day-gift-btn" onclick="openBank()" aria-label="Bank transfer">
                    <img src="bank-icon.png" alt="העברה בנקאית" class="day-gift-btn-icon" />
                </button>
            </div>
        </div>

    </div>

    <!-- ===== BANK MODAL ===== -->
    <div class="modal-backdrop" id="bankModal" onclick="closeBank()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeBank()">×</button>
            <h3 class="modal-title">העברה בנקאית</h3>
            <div class="modal-body">
                <div class="modal-row"><button class="copy-btn" onclick="copyValue(this, 'גבעתי שילת ו/או גידה רועי דוד')" aria-label="העתק">⧉</button><span class="modal-row-value">גבעתי שילת ו/או גידה רועי</span><span class="modal-row-label">שם</span></div>
                <div class="modal-row"><button class="copy-btn" onclick="copyValue(this, '14')" aria-label="העתק">⧉</button><span class="modal-row-value">14 (אוצר החייל)</span><span class="modal-row-label">בנק</span></div>
                <div class="modal-row"><button class="copy-btn" onclick="copyValue(this, '397')" aria-label="העתק">⧉</button><span class="modal-row-value">397</span><span class="modal-row-label">סניף</span></div>
                <div class="modal-row"><button class="copy-btn" onclick="copyValue(this, '185723')" aria-label="העתק">⧉</button><span class="modal-row-value">185723</span><span class="modal-row-label">חשבון</span></div>
            </div>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>

</html>
